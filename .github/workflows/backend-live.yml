name: backend-live

# Calls the real Fake Store API. Run by hand: the provider answers 403 to
# GitHub-hosted runners, so this can't gate pull requests.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: backend/.nvmrc
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:live
        env:
          FAKE_STORE_URL: https://fakestoreapi.com
